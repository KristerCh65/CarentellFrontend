<div class="account section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="login-form border p-5">
                    <div class="text-center heading">
                        <h2 class="mb-2">Login</h2>
                        <p class="lead">Don’t have an account? <a routerLink="/auth/register">Create a free account</a></p>
                    </div>
                    <form [formGroup]="form">
                        <div class="form-group mb-4">
                            <label for="#">Enter username</label>
                            <input type="text" class="form-control" formControlName="userName" placeholder="Enter Username">
                        </div>
                        <div class="form-group">
                            <label for="#">Enter Password</label>
                            <a class="float-right" href="">Forget password?</a>
                            <input type="password" class="form-control" formControlName="password" placeholder="Enter Password">
                        </div>
                        <button (click)="login()" class="btn btn-main mt-3 btn-block">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
