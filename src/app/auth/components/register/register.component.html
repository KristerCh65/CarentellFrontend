<div class="account section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="login-form border p-5">
            <div class="text-center heading">
              <h2 class="mb-2">Sign Up</h2>
              <p class="lead">Already have an account? <a routerLink="/login"> Login now</a></p>
            </div>
            <form [formGroup]="registerForm">
              <div class="form-group mb-4">
                <label for="#">Enter username</label>
                <a class="float-right" href="">Forget password?</a>
                <input type="text" class="form-control" formControlName="userName" placeholder="Enter Password"> 
              </div>
              <div class="form-group mb-4">
                <label for="#">Enter Password</label>
                <input type="password" class="form-control" formControlName="password" placeholder="Enter Password"> 
                <p *ngIf="!passwordMatch;" class="text-danger">Passwords must match</p>
              </div>
              <div class="form-group">
                <label for="#">Confirm Password</label>
                <input type="password" class="form-control" formControlName="confirmPassword" placeholder="Confirm Password"> 
              </div>
              <button [disabled]="!registerForm.valid" (click)="saveProfile()" class="btn btn-main mt-3 btn-block">Signup</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
