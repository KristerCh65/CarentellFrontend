<section class="category section pt-3 pb-0">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="title text-center">
                    <h2>Categories</h2>
                </div>
            </div>
        </div>

        <div class="row">

            <div class="col-lg-4 col-sm-12 col-md-6" *ngFor="let category of categories">
                <div style="height: 300px; cursor: pointer" class="card category-item mb-4 mb-lg-0" (click)="showCarsList(category.categoryId)">
                    <img [src]="category.imageURL" alt="" class="category-image">
                    <div class="card-body">
                        <h5 class="card-title text-center">{{ category.description }}</h5>
                    </div>
                </div>
            </div>
