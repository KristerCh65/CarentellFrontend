<section class="user-dashboard page-wrapper">
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-7 col-sm-12 col-lg-9">
                <div class="tab-pane fade show active" id="settings" role="tabpanel">
                    <div class="acccount-settings">
                        <h4 class="mb-4">Profile information</h4>
                        <form>
                            <div class="form-row">
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <label>First Name</label>
                                        <input type="text" class="form-control" placeholder="John">
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <label>Last Name</label>
                                        <input type="text" class="form-control" placeholder="Jas">
                                    </div>
                                </div>
                            </div>
                            <div class="form-row mb-4">
                                <div class="col-lg-6">
                                    <label>DNI</label>
                                    <input type="text" class="form-control" placeholder="050119995555">
                                </div>
                                <div class="col-lg-6">
                                    <label>Phone Number</label>
                                    <input type="text" class="form-control" placeholder="+504 9999-8888">
                                </div>
                            </div>
                            <div class="form-group mb-4">
                                <label>Email address </label>
                                <input type="text" class="form-control" placeholder="therichposts@gmail.com">
                            </div>

                            <h4 class="mb-4 mt-5">Address Info</h4>

                            <ng-container formGroupName="address">
                                <div class="form-row mb-4">
                                    <div class="col-lg-6">
                                        <label>Departmento </label>
                                        <input type="text" class="form-control" placeholder="Cortes">
                                    </div>
                                    <div class="col-lg-6">
                                        <label>Municipio </label>
                                        <input type="text" class="form-control" placeholder="Cortes">
                                    </div>
                                </div>
                                <div class="form-group mb-4">
                                    <label>Barrio o colonia </label>
                                    <input type="text" class="form-control" placeholder="">
                                </div>
                                <div class="form-group mb-4">
                                    <label>Referencias </label>
                                    <input type="text" class="form-control" placeholder="">
                                </div>
                            </ng-container>

                            <button class="btn btn-dark">Save Changes</button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
