<table class="table table-bordered">
    <thead>
        <tr>
            <th scope="col">N°</th>
            <th scope="col">Fecha de creacion</th>
            <th scope="col">Vehiculo</th>
            <th scope="col">Status</th>
            <th scope="col">Precio</th>
            <th scope="col">Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let car of cars; let i = index">
            <th scope="row">#{{ i + 1}}</th>
            <td>{{car.createdDate | date: 'longDate'}} </td>
            <td>{{car.make.description}} {{car.model.description}} {{car.year}}</td>
            <td>{{car.status}}</td>
            <td>{{car.price | currency: 'L'}}</td>
            <td><a routerLink="/order" class="btn btn-dark btn-small">Ver detalles</a></td>
        </tr> 
    </tbody>
</table>
