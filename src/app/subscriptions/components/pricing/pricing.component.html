<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Precios</h1>
    <p class="lead">Precios disponibles por subscripción mensual.</p>
</div>

<div class="container">
    <div class="card-deck mb-3 text-center">
        <div class="card mb-4 shadow-sm category-item" *ngFor="let p of prices">
            <div class="card-header">
                <h4 class="my-0 font-weight-normal">{{p.description}}</h4>
            </div>
            <div class="card-body">
                <h1 class="card-title pricing-card-title">$ {{p.price}}<small class="text-muted">/ mo</small></h1>
                <ul class="list-unstyled mt-3 mb-4">
                    <li *ngFor="let comment of handleComments(p.comentaries)">
                        {{ comment }}
                    </li>
                </ul>
                <button type="button" [routerLink]="['/subscriptions/checkout/', p.typeSubscryptionID]" class="btn btn-small btn-transparent">Obtener</button>
            </div>
        </div>
    </div>
</div>
